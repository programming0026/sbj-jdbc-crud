spring.application.name=sbj-jdbc-crud
server.port=8080

# PostgreSQL (docker compose up -d). Se pueden sobrescribir con variables de entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jdbccrud}
spring.datasource.username=${DB_USER:jdbccrud}
spring.datasource.password=${DB_PASSWORD:jdbccrud}

# Ejecuta schema.sql (tablas) y data.sql (datos de ejemplo) al arrancar; ambos son idempotentes
spring.sql.init.mode=always
